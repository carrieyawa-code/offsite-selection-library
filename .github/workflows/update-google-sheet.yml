name: Update Google Sheet data

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update encrypted data
        run: node scripts/update-data.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- data/products-data.enc.js; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products-data.enc.js
          git commit -m "Update Google Sheet data"
          git push
